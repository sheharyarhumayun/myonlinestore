<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Clothing - My Online Store</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js"></script>
</head>

<body>

    <nav>
    <button class="menu-btn" onclick="toggleMenu()">☰</button>
    <div class="nav-links" id="nav-links">
        <a href="index.html">Home</a>
        <a href="clothing.html">Clothing</a>
        <a href="cooking.html">Cooking</a>
        <a href="cart.html">Cart 🛒</a>
    </div>
    <input type="text" id="searchBar" placeholder="Search products..." onkeyup="searchProducts()">
</nav>

    <h1>Clothing</h1>
    <p>Welcome to our clothing collection.</p>

    <div class="products">

        <div class="product" data-name="Basic T-Shirt">
            <img src="https://via.placeholder.com/200" alt="T-Shirt">
            <h2>Basic T-Shirt</h2>
            <p>$25.00</p>
            <button onclick="addToCart('Basic T-Shirt', 25)">
                Add to Cart
            </button>
        </div>

        <div class="product">
            <img src="https://via.placeholder.com/200" alt="Hoodie">
            <h2>Classic Hoodie</h2>
            <p>$45.00</p>
            <button onclick="addToCart('Classic Hoodie', 45)">
                Add to Cart
            </button>
        </div>

        <div class="product">
            <img src="https://via.placeholder.com/200" alt="Jeans">
            <h2>Classic Jeans</h2>
            <p>$55.00</p>
            <button onclick="addToCart('Classic Jeans', 55)">
                Add to Cart
            </button>
        </div>

    </div>

</body>
</html>
